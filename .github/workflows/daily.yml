name: 六级词汇每日推送

on:
  schedule:
    # 北京时间 08:55 / 09:05 / 09:15 / 09:45 各试一次（UTC+8 = UTC +8）
    # GitHub 免费定时队列经常排队延迟，多设几个时间点提高准点概率；
    # 脚本里有「当天已推送就跳过」的保护，所以不会重复发送。
    - cron: "55 0 * * *"
    - cron: "5 1 * * *"
    - cron: "15 1 * * *"
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "强制推送第 N 天（留空=按日期自动）"
        required: false
        type: string
      dry_run:
        description: "只渲染不发送（true/false）"
        required: false
        default: "false"
        type: string
      force:
        description: "强制推送，忽略“今天已推过”（true/false）"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: cet6-daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 推送到微信
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          FORCE_DAY: ${{ inputs.day }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          ARGS=""
          if [ -n "${FORCE_DAY}" ]; then ARGS="$ARGS --day ${FORCE_DAY}"; fi
          if [ "${DRY_RUN}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${FORCE}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "python3 scripts/daily.py $ARGS"
          python3 scripts/daily.py $ARGS

      - name: 归档回仓库（顺带让仓库保持活跃，避免定时任务被自动停用）
        if: always()
        run: |
          git config user.name "cet6-bot"
          git config user.email "cet6-bot@users.noreply.github.com"
          git add -A out 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有新的归档"
          else
            git commit -m "archive: $(TZ=Asia/Shanghai date +%F)"
            git push || echo "::warning::push 失败（不影响推送）"
          fi
